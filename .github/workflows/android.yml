name: Android App Build

on:
  workflow_dispatch:
    inputs:
      signed_release:
        type: boolean
        default: false
        description: Build a signed release APK
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./android

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug testDebugUnitTest lintDebug

    - uses: actions/upload-artifact@v4
      with:
        name: Mimo-Android-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Build signed release
      if: github.ref == 'refs/heads/main' && inputs.signed_release
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -eu
        umask 077
        export MIMO_KEYSTORE_PATH="$RUNNER_TEMP/mimo-release.keystore"
        trap 'rm -f "$MIMO_KEYSTORE_PATH"' EXIT
        printf '%s' "${KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$MIMO_KEYSTORE_PATH"
        ./gradlew assembleRelease
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

    - uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/main' && inputs.signed_release
      with:
        name: Mimo-Android-release
        path: android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install the test backend
      run: python -m pip install -r requirements_server.txt
    - name: Run student and parent flows on Android 14
      run: |
        set -euo pipefail
        sudo setfacl -m "u:$USER:rw" /dev/kvm
        image="system-images;android-34;default;x86_64"
        sdkmanager --install emulator platform-tools "$image"
        echo no | avdmanager create avd --name mimo-device --package "$image" --device pixel_2
        "$ANDROID_HOME/emulator/emulator" -avd mimo-device -accel on -no-window -no-snapshot -no-boot-anim -noaudio \
          -gpu swiftshader_indirect > "$RUNNER_TEMP/mimo-emulator.log" 2>&1 &
        emulator_pid=$!
        trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
        if ! timeout 420 bash -c 'until adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 3; done'; then
          tail -50 "$RUNNER_TEMP/mimo-emulator.log"
          exit 1
        fi
        adb -e shell input keyevent KEYCODE_WAKEUP
        adb -e shell wm dismiss-keyguard
        scripts/check_android_device.sh
    - name: Upload device test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mimo-Android-device-tests
        path: android/app/build/outputs/androidTest-results/connected/
        if-no-files-found: ignore
