name: Desktop App Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements_desktop.txt) { pip install -r requirements_desktop.txt }
        pip install pyinstaller

    - name: Build executable
      run: |
        python desktop/build.py

    - name: Launch and verify the packaged Windows app
      run: python scripts/check_desktop_bundle.py dist/Mimo/Mimo.exe

    - uses: actions/upload-artifact@v4
      with:
        name: Mimo-Windows
        path: dist/Mimo/
        if-no-files-found: error
