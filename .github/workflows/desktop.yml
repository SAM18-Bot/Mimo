name: Desktop App Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up the Windows build environment
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.6"
        python-version: "3.11.18"
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: 'requirements*.txt'

    - name: Install dependencies
      run: |
        python --version
        uv pip install -r requirements_desktop.txt
        uv pip check

    - name: Build executable
      run: |
        python desktop/build.py

    - name: Launch and verify the packaged Windows app
      run: python scripts/check_desktop_bundle.py dist/Mimo/Mimo.exe

    - uses: actions/upload-artifact@v4
      with:
        name: Mimo-Windows
        path: dist/Mimo/
        if-no-files-found: error
