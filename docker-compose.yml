version: '3.8'

services:
  mimo-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mimo_user:mimo_pass@mimo-db:5432/mimo_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set a strong JWT_SECRET_KEY in your environment}
      - SECRET_KEY=${SECRET_KEY:?Set your persisted Fernet key}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NO_HARDWARE=1
      - NO_VOICE=1
    depends_on:
      mimo-db:
        condition: service_healthy
    restart: unless-stopped

  mimo-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mimo_user
      - POSTGRES_PASSWORD=mimo_pass
      - POSTGRES_DB=mimo_db
    volumes:
      - mimo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimo_user -d mimo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mimo_db_data:
